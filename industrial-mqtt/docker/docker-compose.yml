services:
  postgres:
    image: postgres:16-alpine
    container_name: factory_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: factory_user
      POSTGRES_PASSWORD: factory_secure_pass_2026
      POSTGRES_DB: factory_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U factory_user -d factory_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Web-based database management tool for easy inspection
  adminer:
    image: adminer:latest
    container_name: factory_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
